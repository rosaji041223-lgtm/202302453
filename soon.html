<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>준비중이에요</title>
<script src="page-fade.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg: #fff; --fg: #000; --accent: #000; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: "Helvetica Neue", Helvetica, Arial, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }

  /* 1920×1080 무대 */
  .stage {
    position: absolute; left: 50%; top: 50%;
    width: 1920px; height: 1080px;
    transform: translate(-50%, -50%) scale(var(--scale, 1));
  }

  /* 뒤로가기 */
  .back {
    position: absolute; left: 80px; top: 72px; z-index: 2;
    display: inline-flex; align-items: center; gap: 14px;
    padding: 18px 30px 18px 24px;
    border: 2px solid currentColor; border-radius: 999px;
    color: var(--fg); text-decoration: none;
    font-size: 24px; font-weight: 500; letter-spacing: .08em;
    transition: background .2s, color .2s, transform .2s;
  }
  .back svg { width: 26px; height: 26px; transition: transform .2s; }
  .back:hover, .back:focus-visible { background: var(--fg); color: var(--bg); outline: none; }
  .back:hover svg { transform: translateX(-4px); }

  /* 가운데 문구 */
  .center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
  }
  .label {
    font-size: 26px; letter-spacing: .2em; color: var(--accent);
    margin-bottom: 36px;
  }
  .title {
    font-size: 150px; font-weight: 500; line-height: .95; letter-spacing: -.01em;
    color: var(--accent);
    animation: rise .7s cubic-bezier(.2,.8,.2,1) both;
  }
  .msg {
    margin-top: 56px; font-size: 44px; font-weight: 600;
    animation: rise .7s .12s cubic-bezier(.2,.8,.2,1) both;
  }
  .dots span { display: inline-block; animation: blink 1.4s infinite; }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }

  .foot {
    position: absolute; right: 80px; bottom: 72px;
    font-size: 22px; letter-spacing: .2em; opacity: .7;
  }

  @keyframes rise { from { opacity: 0; transform: translateY(40px); } }
  @keyframes blink { 0%, 100% { opacity: .2; } 40% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .title, .msg, .dots span { animation: none; }
  }
</style>
</head>
<body>
<main class="stage" id="stage">
  <a class="back" href="index.html#shelf" aria-label="책장으로 돌아가기">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    BACK
  </a>

  <section class="center">
    <p class="label" id="label">JI EUNJI ©</p>
    <h1 class="title" id="title">WORK</h1>
    <p class="msg">준비중이에요<span class="dots"><span>.</span><span>.</span><span>.</span></span></p>
  </section>

  <p class="foot">COMING SOON</p>
</main>

<script>
  // 책마다 책등 색을 그대로 사용 (03/01.pdf 기준)
  const BOOKS = {
    leaflet:  { title: 'LEAFLET',              label: 'JI EUNJI ©', bg: '#000000', fg: '#ffffff', accent: '#66d37a' },
    cover:    { title: 'COVER',                label: '지은지 ©',    bg: '#2427e8', fg: '#ffffff', accent: '#f6d94f' },
    poster:   { title: 'POSTER',               label: 'ARCHIVE',    bg: '#ffffff', fg: '#000000', accent: '#000000' },
    banner:   { title: 'BANNER',               label: '∞',          bg: '#ea4498', fg: '#000000', accent: '#000000' },
    detail:   { title: 'PRODUCT<br>DETAIL PAGE', label: '',         bg: '#cccccc', fg: '#000000', accent: '#000000' },
    cardnews: { title: 'CARD NEWS',            label: 'VOL. 01',    bg: '#f6d94f', fg: '#000000', accent: '#2427e8' },
  };
  const key = new URLSearchParams(location.search).get('w');
  const b = BOOKS[key];
  if (b) {
    const r = document.documentElement.style;
    r.setProperty('--bg', b.bg); r.setProperty('--fg', b.fg); r.setProperty('--accent', b.accent);
    document.getElementById('title').innerHTML = b.title;
    document.getElementById('label').textContent = b.label;
    document.title = b.title.replace('<br>', ' ') + ' — 준비중이에요';
  }

  const fit = () => document.getElementById('stage').style
    .setProperty('--scale', Math.min(innerWidth / 1920, innerHeight / 1080));
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
